# Ajuste de capacidade do hot path em producao.
# O HPA usa 70% do request de CPU como alvo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
spec:
  template:
    spec:
      containers:
        - name: donation-service
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
