# Host, nome do ALB e tags do ambiente (JSON patch).
# Aplicado com target definido em kustomization.yaml para nao duplicar os paths da base.
- op: replace
  path: /spec/rules/0/host
  value: dev.solidarytech.example.com
- op: add
  path: /metadata/annotations/alb.ingress.kubernetes.io~1load-balancer-name
  value: solidarytech-dev
- op: replace
  path: /metadata/annotations/alb.ingress.kubernetes.io~1tags
  value: Project=solidarytech,Environment=dev,ManagedBy=kustomize
