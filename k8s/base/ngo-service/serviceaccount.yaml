apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngo-service
  labels:
    app.kubernetes.io/name: ngo-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: solidarytech
    app.kubernetes.io/managed-by: kustomize

# O ngo-service nao chama a API do Kubernetes nem servicos AWS
# (usa apenas o PostgreSQL via DATABASE_URL), por isso nao monta token.
automountServiceAccountToken: false
