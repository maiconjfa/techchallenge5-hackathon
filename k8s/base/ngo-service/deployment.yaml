apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo-service
  labels:
    app.kubernetes.io/name: ngo-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: solidarytech
    app.kubernetes.io/managed-by: kustomize
spec:
  # O HPA assume o controle apos o deploy; este valor e apenas o estado inicial.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Nunca reduz a capacidade disponivel durante um rollout.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ngo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ngo-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: solidarytech
    spec:
      serviceAccountName: ngo-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Distribui as replicas entre zonas e nos para reduzir blast radius.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ngo-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ngo-service
      containers:
        - name: ngo-service
          # A imagem real do ECR e definida pelo overlay (kustomization.yaml > images).
          image: ngo-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ngo-service-config
            - secretRef:
                name: ngo-service-secrets
          resources:
            # Requests = baseline de capacidade/custo. Limits evitam noisy neighbor.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Da tempo para o ALB remover o pod do target group antes do SIGTERM.
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gunicorn e o Python precisam de /tmp gravavel mesmo com rootfs read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
