apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solidarytech
  labels:
    app.kubernetes.io/name: solidarytech
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: solidarytech
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Requer o AWS Load Balancer Controller instalado no cluster.
    # As subnets publicas precisam das tags kubernetes.io/role/elb=1 (ou interno).
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/tags: Project=solidarytech,ManagedBy=kustomize
spec:
  ingressClassName: alb
  rules:
    # Host, HTTPS e nome do ALB sao definidos pelo overlay do ambiente.
    - host: solidarytech.example.com
      http:
        paths:
          - path: /ngos
            pathType: Prefix
            backend:
              service:
                name: ngo-service
                port:
                  name: http
          - path: /donations
            pathType: Prefix
            backend:
              service:
                name: donation-service
                port:
                  name: http
          - path: /volunteers
            pathType: Prefix
            backend:
              service:
                name: volunteer-service
                port:
                  name: http
