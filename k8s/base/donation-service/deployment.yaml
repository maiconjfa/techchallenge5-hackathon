apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  labels:
    app.kubernetes.io/name: donation-service
    app.kubernetes.io/component: hot-path
    app.kubernetes.io/part-of: solidarytech
    app.kubernetes.io/managed-by: kustomize
spec:
  # Servico critico (hot path). O HPA assume o controle apos o deploy.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: donation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donation-service
        app.kubernetes.io/component: hot-path
        app.kubernetes.io/part-of: solidarytech
    spec:
      serviceAccountName: donation-service
      # Mantido true para o token projetado usado pelo IRSA (SQS).
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: donation-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: donation-service
      containers:
        - name: donation-service
          # A imagem real do ECR e definida pelo overlay (kustomization.yaml > images).
          image: donation-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: donation-service-config
            - secretRef:
                name: donation-service-secrets
          resources:
            # Hot path: requests maiores que os demais servicos.
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
