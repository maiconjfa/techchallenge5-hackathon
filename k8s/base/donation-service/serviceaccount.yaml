apiVersion: v1
kind: ServiceAccount
metadata:
  name: donation-service
  labels:
    app.kubernetes.io/name: donation-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: solidarytech
    app.kubernetes.io/managed-by: kustomize

# Necessario para IRSA (AWS SQS). Os overlays adicionam a annotation
# eks.amazonaws.com/role-arn com o IAM Role do ambiente.
automountServiceAccountToken: true
