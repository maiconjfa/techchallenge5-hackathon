apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Camada base dos tres microsservicos da SolidaryTech.
#
# NAO aplique esta base diretamente em producao: ela nao define namespace,
# imagens do ECR, segredos nem parametros de ambiente. Use um dos overlays:
#
#   kubectl apply -k k8s/overlays/dev
#   kubectl apply -k k8s/overlays/prod

resources:
  - ngo-service/serviceaccount.yaml
  - ngo-service/configmap.yaml
  - ngo-service/deployment.yaml
  - ngo-service/service.yaml
  - ngo-service/hpa.yaml
  - ngo-service/pdb.yaml

  - donation-service/serviceaccount.yaml
  - donation-service/configmap.yaml
  - donation-service/deployment.yaml
  - donation-service/service.yaml
  - donation-service/hpa.yaml
  - donation-service/pdb.yaml

  - volunteer-service/serviceaccount.yaml
  - volunteer-service/configmap.yaml
  - volunteer-service/deployment.yaml
  - volunteer-service/service.yaml
  - volunteer-service/hpa.yaml
  - volunteer-service/pdb.yaml

  - ingress.yaml
  - networkpolicy.yaml
